name: Deploy Static HTML to GitHub Pages
on: push: branches: ["main"] # или "master", в зависимости от того, как называется твоя ветка
permissions: contents: read pages: write id-token: write
concurrency: group: "pages" cancel-in-progress: false
jobs: deploy: environment: name: github-pages url: ${{ steps.deployment.outputs.page_url }} runs-on: ubuntu-latest steps: - name: Checkout uses: actions/checkout@v4
  - name: Setup Pages
    uses: actions/configure-pages@v4

  - name: Upload artifact
    uses: actions/upload-pages-artifact@v3
    with:
      path: '.' # Укажи путь к папке с сайтом, если файлы лежат не в корне (например, './docs')

  - name: Deploy to GitHub Pages
    id: deployment
    uses: actions/deploy-pages@v4
