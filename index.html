<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact Form</title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>

<body>
  <header class="site-header">
    <nav class="container site-nav" aria-label="Main navigation">
      <a class="site-brand" href="index.html">Forms</a>
      <div class="nav-links">
        <a class="nav-item active" href="index.html" aria-current="page">Task 0</a>
        <a class="nav-item" href="task1.html">Task 1</a>
        <a class="nav-item" href="task2.html">Task 2</a>
        <a class="nav-item" href="task3.html">Task 3</a>
        <a class="nav-item" href="task4.html">Task 4</a>
      </div>
    </nav>

  </header>
  <main class="container page">
    <h1>Simple Contact Form</h1>
    <section class="form-panel">
      <form id="form0">
        <div class="basic-field">
          <label for="name0">Name</label>
          <input id="name0" name="name" type="text">
        </div>
        <div class="basic-field">
          <label for="email0">Email</label>
          <input id="email0" name="email" type="email">
        </div>
        <div class="basic-field">
          <label for="message0">Message</label>
          <textarea id="message0" name="message" rows="5"></textarea>
        </div>
        <button class="basic-button" type="submit">Submit</button>
        <div class="form-status mt-3" role="status" aria-live="polite" hidden></div>
      </form>
    </section>
  </main>
</body>
</html>
